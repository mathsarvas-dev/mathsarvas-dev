const GLYPHS = "01ABCDEF<>/\\_=+-[]{}#";

function Decode({ text, className = "", delay = 0 }) {
  const ref = useRef(null);
  const inView = useInView(ref, { once: true, margin: "-10% 0px" });
  const [out, setOut] = useState(text.replace(/\S/g, "·"));
  useEffect(() => {
    if (!inView) return;
    let f = 0; const total = 18;
    const t0 = setTimeout(() => {
      const id = setInterval(() => {
        f++;
        const done = Math.floor((f / total) * text.length);
        setOut(text.split("").map((c, i) => c === " " ? " " : i < done ? c : GLYPHS[Math.floor(Math.random() * GLYPHS.length)]).join(""));
        if (f >= total) { clearInterval(id); setOut(text); }
      }, 30);
    }, delay);
    return () => clearTimeout(t0);
  }, [inView]);
  return <span ref={ref} className={className} aria-label={text}>{out}</span>;
}

function Reveal({ children, delay = 0, className = "" }) {
  return (
    <motion.div className={className} initial={{ opacity: 0, y: 12 }} whileInView={{ opacity: 1, y: 0 }}
      viewport={{ once: true, margin: "-8% 0px" }} transition={{ duration: 0.4, ease: "easeOut", delay }}>
      {children}
    </motion.div>
  );
}

function Corners({ a, b, c, d }) {
  const cls = "mono absolute text-[10px] tracking-wider text-[#555] select-none";
  return (<>

    <span className={cls + " bottom-2 left-3"}>{c}</span>
    <span className={cls + " bottom-2 right-3"}>{d}</span>
  </>);
}

function DotField() {
  const ref = useRef(null);
  useEffect(() => {
    const cv = ref.current, ctx = cv.getContext("2d");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let w, h, raf, mx = -999, my = -999, tx = -999, ty = -999, t = 0;
    const resize = () => { const r = cv.getBoundingClientRect(); w = r.width; h = r.height; cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
    resize(); window.addEventListener("resize", resize);
    const move = (e) => { const r = cv.getBoundingClientRect(); tx = e.clientX - r.left; ty = e.clientY - r.top; };
    const leave = () => { tx = -999; ty = -999; };
    window.addEventListener("pointermove", move);
    const step = 18;
    const draw = () => {
      t += 0.012; mx += (tx - mx) * 0.12; my += (ty - my) * 0.12;
      ctx.clearRect(0, 0, w, h);
      ctx.font = "10px JetBrains Mono, monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      const cx = w > 800 ? w * 0.68 : w / 2, cy = h * 0.52, R = Math.min(w, h) * 0.78;
      for (let y = step / 2; y < h; y += step) for (let x = step / 2; x < w; x += step) {
        const dx = x - cx, dy = y - cy, d = Math.hypot(dx, dy);
        if (d > R) continue;
        const z = Math.sqrt(1 - (d / R) ** 2);
        const wave = Math.sin(d * 0.045 - t * 3) * 0.5 + 0.5;
        const md = Math.hypot(x - mx, y - my);
        const near = Math.max(0, 1 - md / 110);
        const a = 0.12 + z * 0.35 * wave + near * 0.8;
        const ox = near * ((x - mx) / (md + 1)) * 8, oy = near * ((y - my) / (md + 1)) * 8;
        ctx.fillStyle = `rgba(${244 - near * 100 | 0},${244 - near * 70 | 0},255,${Math.min(a, 1)})`;
        if (near > 0.15 || (wave > 0.82 && z > 0.5)) ctx.fillText(GLYPHS[(x * 7 + y * 13 + Math.floor(t * 4)) % GLYPHS.length], x + ox, y + oy);
        else { ctx.beginPath(); ctx.arc(x + ox, y + oy, 0.8 + z * 0.9, 0, 6.283); ctx.fill(); }
      }
      raf = requestAnimationFrame(draw);
    };
    draw();
    return () => { cancelAnimationFrame(raf); window.removeEventListener("resize", resize); window.removeEventListener("pointermove", move); };
  }, []);
  return <canvas ref={ref} className="absolute inset-0 w-full h-full block pointer-events-none" />;
}

function Tilt({ children, className = "" }) {
  const ref = useRef(null);
  const px = useMotionValue(0.5), py = useMotionValue(0.5);
  const sx = useSpring(px, { stiffness: 200, damping: 30 }), sy = useSpring(py, { stiffness: 200, damping: 30 });
  const rx = useTransform(sy, [0, 1], [5, -5]), ry = useTransform(sx, [0, 1], [-5, 5]);
  const bg = useTransform([sx, sy], ([x, y]) => `radial-gradient(420px circle at ${x * 100}% ${y * 100}%, rgba(255,255,255,.10), transparent 55%)`);
  const onMove = (e) => { const r = ref.current.getBoundingClientRect(); px.set((e.clientX - r.left) / r.width); py.set((e.clientY - r.top) / r.height); };
  const onLeave = () => { px.set(0.5); py.set(0.5); };
  return (
    <div style={{ perspective: 1000 }}>
      <motion.div ref={ref} onPointerMove={onMove} onPointerLeave={onLeave}
        style={{ rotateX: rx, rotateY: ry, transformStyle: "preserve-3d" }} className={"glass relative overflow-hidden " + className}>
        <motion.div className="absolute inset-0 pointer-events-none" style={{ background: bg }} />
        {children}
      </motion.div>
    </div>
  );
}

function Cursor() {
  const ref = useRef(null);
  useEffect(() => {
    const cv = ref.current, ctx = cv.getContext("2d");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let w, h, raf, mx = -999, my = -999, tx = -999, ty = -999, pulses = [];
    const resize = () => { w = window.innerWidth; h = window.innerHeight; cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
    resize();
    const move = (e) => { if (e.pointerType === "touch") return; tx = e.clientX; ty = e.clientY; if (mx < 0) { mx = tx; my = ty; } };
    const down = (e) => { const n = performance.now(); for (let i = 0; i < 4; i++) pulses.push({ x: e.clientX, y: e.clientY, t0: n + i * 160, amp: 1 - i * 0.18 }); if (pulses.length > 20) pulses.splice(0, pulses.length - 20); };
    window.addEventListener("resize", resize); window.addEventListener("pointermove", move); window.addEventListener("pointerdown", down);
    const step = 40, LIFE = 1400;
    const draw = (now) => {
      mx += (tx - mx) * 0.08; my += (ty - my) * 0.08;
      ctx.clearRect(0, 0, w, h);
      if (tx > 0) {
        const g = ctx.createRadialGradient(mx, my, 0, mx, my, 200);
        g.addColorStop(0, "rgba(50,90,190,0.13)"); g.addColorStop(1, "rgba(50,90,190,0)");
        ctx.fillStyle = g; ctx.fillRect(mx - 200, my - 200, 400, 400);
      }
      ctx.font = "9px JetBrains Mono, monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      pulses = pulses.filter((p) => now - p.t0 < LIFE);
      for (let y = step / 2; y < h; y += step) for (let x = step / 2; x < w; x += step) {
        const seed = ((x * 73856093) ^ (y * 19349663)) >>> 0;
        const special = seed % 29 === 0;
        const md = Math.hypot(x - mx, y - my);
        const near = Math.max(0, 1 - md / 220);
        let boost = 0, ox = ((x - mx) / (md + 1)) * near * 5, oy = ((y - my) / (md + 1)) * near * 5;
        for (const p of pulses) {
          const age = (now - p.t0) / LIFE; if (age < 0) continue; const d = Math.hypot(x - p.x, y - p.y);
          const k = Math.max(0, 1 - Math.abs(d - age * 520) / 50) * (1 - age) * p.amp;
          if (k > 0) { boost += k; ox += ((x - p.x) / (d + 1)) * k * 6; oy += ((y - p.y) / (d + 1)) * k * 6; }
        }
        const a = (special ? 0.2 : 0.05) + near * 0.3 + boost * 0.5;
        const blue = special || near > 0.3 || boost > 0.1;
        ctx.fillStyle = `rgba(${blue ? "95,140,240" : "200,210,230"},${Math.min(a, 0.8)})`;
        if (boost > 0.35 || near > 0.8) ctx.fillText(GLYPHS[seed % GLYPHS.length], x + ox, y + oy);
        else { ctx.beginPath(); ctx.arc(x + ox, y + oy, special ? 1.3 : 0.8 + near * 0.8, 0, 6.283); ctx.fill(); }
      }
      raf = requestAnimationFrame(draw);
    };
    raf = requestAnimationFrame(draw);
    return () => { cancelAnimationFrame(raf); window.removeEventListener("resize", resize); window.removeEventListener("pointermove", move); window.removeEventListener("pointerdown", down); };
  }, []);
  return (<>
    <div className="fixed inset-0 -z-20 pointer-events-none" style={{ background: "radial-gradient(60% 50% at 85% 0%, rgba(14,34,82,.55), transparent 70%), radial-gradient(50% 45% at 0% 100%, rgba(10,26,64,.45), transparent 70%), radial-gradient(40% 40% at 50% 55%, rgba(10,22,52,.25), transparent 70%)" }} />
    <canvas ref={ref} className="fixed inset-0 w-full h-full -z-10 pointer-events-none" />
  </>);
}

function App() {
  return (<><Cursor /><Nav /><Hero /><About /><Experience /><Projects /><Footer /></>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
